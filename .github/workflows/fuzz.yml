name: fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.fuzz }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./wire, fuzz: FuzzFeed }
          - { pkg: ./wire, fuzz: FuzzRoundTrip }
          - { pkg: ./capture, fuzz: FuzzReader }
          - { pkg: ./game, fuzz: FuzzParse }
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz='^${{ matrix.fuzz }}$' -fuzztime=2m ${{ matrix.pkg }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crasher-${{ matrix.fuzz }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.fuzz }}/
